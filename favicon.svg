<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- SFONDO GRADIENTE NOTTURNO -->
    <linearGradient id="bgGlowAlt" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>

    <!-- GRADIENTE ORO/ACCENTO MONOGRAMMA -->
    <linearGradient id="accentGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>

    <!-- GRADIENTE ROSSO TRATTO DINAMICO -->
    <linearGradient id="accentRed" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ef4444" />
      <stop offset="100%" stop-color="#dc2626" />
    </linearGradient>

    <!-- OMBRA PROFONDA -->
    <filter id="iconShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000000" flood-opacity="0.6" />
    </filter>
  </defs>

  <!-- Sfondo Icona Arrotondato -->
  <rect width="512" height="512" rx="120" fill="url(#bgGlowAlt)" />
  <rect width="504" height="504" x="4" y="4" rx="116" fill="none" stroke="#ffffff" stroke-opacity="0.12" stroke-width="8" />

  <g filter="url(#iconShadow)">
    <!-- SCUDO DI SFONDO STILIZZATO -->
    <path d="M 256,70 L 380,120 C 380,260 330,360 256,420 C 182,360 132,260 132,120 Z" 
          fill="#1e293b" stroke="url(#accentGold)" stroke-width="12" stroke-linejoin="round" />

    <!-- LETTERA F (Sinistra) -->
    <path d="M 180,160 L 235,160 C 245,160 250,165 250,175 L 245,190 C 245,198 238,202 230,202 L 205,202 L 200,225 L 230,225 C 238,225 243,230 241,238 L 237,252 C 235,260 228,265 220,265 L 190,265 L 170,340 C 168,348 160,355 150,355 L 135,355 C 125,355 120,348 122,338 L 165,175 C 167,165 173,160 180,160 Z" 
          fill="#ffffff" />

    <!-- LETTERA A + MARTELLO INTEGRATO (Destra) -->
    <!-- Asta della A -->
    <path d="M 310,160 L 330,160 C 338,160 345,166 348,174 L 385,338 C 388,348 382,355 370,355 L 350,355 C 340,355 334,349 331,340 L 320,300 L 275,300 L 260,340 C 257,349 250,355 240,355 L 225,355 C 215,355 210,348 213,338 L 250,174 C 253,166 260,160 270,160 Z M 283,260 L 310,260 L 297,205 Z" 
          fill="url(#accentGold)" />

    <!-- MARTELLO D'ASTA DINAMICO (Sovrapposto e tagliato in diagonale) -->
    <g transform="translate(290, 210) rotate(-35)">
      <!-- Testa del martello -->
      <rect x="-35" y="-15" width="70" height="30" rx="6" fill="url(#accentRed)" stroke="#ffffff" stroke-width="3" />
      <!-- Manico del martello -->
      <rect x="-6" y="15" width="12" height="90" rx="6" fill="#ffffff" />
    </g>
  </g>
</svg>
